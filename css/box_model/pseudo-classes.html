<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-classes</title>
    <style>
        a:link {
            background-color: red;
        }
        a:visited {
            color: red;
        }
        a:hover {
            background-color: greenyellow;
        }
        a:active {
            background-color: violet;
        }
    </style>
</head>
<body>
    <p>Ir para <a href="www.globo.com"> o site da Globo</a></p>
</body>
</html>
