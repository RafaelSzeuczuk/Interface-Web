<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        html{
            background-color: #95a5a6;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        form{
            width: 50vw;
            background-color: #ecf0f1;
            border-radius: 5px;
            box-shadow: 3px 3px 10px #333;
        }
        input, label{
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        label{
            margin-bottom:  .25em;
        }
        input{
            padding: .75em;
            border-radius: 5px;
            border: 1px solid #bbb;
            margin-bottom: 1.5em;
            font-size: 1em;
        }
        legend{
            padding: 1em;
            texte-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #454e4f;
        }
        .btn{
            background-color: #959595;
            color: #ffff;

            cursor: pointer;
        }
        .btn2{
            background-color: #fa7082;
            color: #ffff;
            cursor: pointer;
        }
        .actions{
            display: flex;
            gap: 1em;
        }

            
    </style>
</head>
<body>
    <h1>Login</h1>
    <form actions="#" method="get">
        <fieldset>
            <legend>Insira os seus dados</legend>
            <label for="username">Usuário</label>
            <input type="text" name="user" required autofocus>
            <label for="pass">Senha</label>
            <input type="password" name="pass">
            <div class="actions">
                <input type="reset" value="Limpar" class="btn2">
                <input type="submit" value="Enviar" class="btn">
            </div>
        </fieldset>
    </form>
</body>
</html>
