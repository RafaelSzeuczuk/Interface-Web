<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container-formulario {
            background-color: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .secao-dados {
            border: none;
            margin-bottom: 25px;
        }

        .titulo-secao {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: #000;
            display: block;
            width: 100%;
        }

        .grade-campos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .caixa-entrada {
            position: relative;
            display: flex;
            align-items: center;
        }
        .icone-entrada {
            position: absolute;
            left: 12px;
            width: 18px;
            height: 18px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
        }

        .entrada-texto {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }

        .entrada-texto:focus {
            border-color: #1e5bb8;
        }

        .botao-enviar {
            width: 100%;
            background-color: #1e5bb8;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .botao-enviar:hover {
            background-color: #164a96;
        }


    </style>
</head>
<body>

<div class="container-formulario">
    <form action="#" method="POST">
        <fieldset class="secao-dados">
            <legend class="titulo-secao">Personal Data</legend>
            <div class="grade-campos">
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/user.svg');"></div>
                    <input type="text" name="nome" class="entrada-texto" placeholder="Full Name">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/file-text.svg');"></div>
                    <input type="text" name="cpf" class="entrada-texto" placeholder="CPF">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/calendar.svg');"></div>
                    <input type="text" name="nascimento" class="entrada-texto" placeholder="Date of Birth">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/phone.svg');"></div>
                    <input type="tel" name="telefone" class="entrada-texto" placeholder="Phone Number">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/mail.svg');"></div>
                    <input type="password" name="senha" class="entrada-texto" placeholder="Password">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/lock.svg');"></div>
                    <input type="password" name="confirmar_senha" class="entrada-texto" placeholder="Password">
                </div>
            </div>
        </fieldset>

        <fieldset class="secao-dados">
            <legend class="titulo-secao">Address</legend>
            <div class="grade-campos">
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/map-pin.svg');"></div>
                    <input type="text" name="cep" class="entrada-texto" placeholder="ZIP Code (CEP)">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/home.svg');"></div>
                    <input type="text" name="rua" class="entrada-texto" placeholder="Street">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/building.svg');"></div>
                    <input type="text" name="bairro" class="entrada-texto" placeholder="Neighborhood">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/bell.svg');"></div>
                    <input type="text" name="cidade" class="entrada-texto" placeholder="City">
                </div>
            </div>
        </fieldset>

        <fieldset class="secao-dados">
            <legend class="titulo-secao">Professional Data</legend>
            <div class="grade-campos">
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/shopping-cart.svg');"></div>
                    <input type="text" name="empresa" class="entrada-texto" placeholder="Company">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/users.svg');"></div>
                    <input type="text" name="cargo" class="entrada-texto" placeholder="Job Title">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/briefcase.svg');"></div>
                    <input type="text" name="cargo2" class="entrada-texto" placeholder="Job Title">
                </div>
                <div class="caixa-entrada">
                    <div class="icone-entrada" style="background-image: url('https://unpkg.com/lucide-static@latest/icons/linkedin.svg'); filter: none;"></div>
                    <input type="text" name="linkedin" class="entrada-texto" placeholder="LinkedIn URL">
                </div>
            </div>
        </fieldset>

        <button type="submit" class="botao-enviar">Create Account</button>
    </form>
</div>

</body>
</html>
